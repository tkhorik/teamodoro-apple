name: Teamodoro

options:
  bundleIdPrefix: com.teamodoro
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

packages:
  SynchronizedTimerCore:
    path: .

targets:
  Teamodoro:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: TeamodoroApp
    resources:
      - TeamodoroApp/Assets.xcassets
      - TeamodoroApp/Preview Content
    dependencies:
      - package: SynchronizedTimerCore
        product: SynchronizedTimerCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.teamodoro.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Teamodoro
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          DEBUG_INFORMATION_FORMAT: dwarf
        Release:
          DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
          SWIFT_COMPILATION_MODE: wholemodule
